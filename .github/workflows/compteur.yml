# =====================================================================
#  Relève le nombre d'inscriptions chez Brevo et l'écrit dans le site.
#
#  POURQUOI PASSER PAR ICI plutôt que d'interroger Brevo depuis la page :
#  une clé d'API Brevo donne accès à TOUT le compte — envoyer des
#  courriels, exporter la liste des contacts, la supprimer. Mise dans une
#  page web, elle est lisible par n'importe qui en trois clics. Elle reste
#  donc ici, dans les secrets du dépôt, et la page ne lit qu'un nombre.
#
#  À ACTIVER UNE FOIS : dépôt → Settings → Secrets and variables →
#  Actions → New repository secret → nom « BREVO_API_KEY ».
#  Sans ce secret, l'ouvrage ne fait rien et le site n'affiche pas de
#  compteur — il ne casse pas.
#
#  La liste visée est « BINGO STUDIO » (n° 3). Pour en viser une autre :
#  même écran, onglet « Variables » → BREVO_LISTE_ID.
# =====================================================================

name: Relever le compteur

on:
  schedule:
    # Quatre fois par jour. Inutile d'être à la minute près : c'est un
    # chiffre d'affichage, pas une donnée de gestion.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compteur
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Interroger Brevo
        id: brevo
        env:
          CLE: ${{ secrets.BREVO_API_KEY }}
          # Numéro de la liste « BINGO STUDIO » dans Brevo. Si elle est un jour
          # recréée, son numéro change : on le pose ici plutôt qu'en dur.
          LISTE: ${{ vars.BREVO_LISTE_ID || '3' }}
        run: |
          if [ -z "$CLE" ]; then
            echo "Secret BREVO_API_KEY absent — rien à faire."
            echo "ok=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On interroge la LISTE « BINGO STUDIO » (n° 3), pas le compte
          # entier : le compte peut contenir des contacts venus d'ailleurs, et
          # le chiffre affiché doit vouloir dire « télévisions inscrites à
          # Bingo Studio », rien d'autre.
          reponse=$(curl -s -w '\n%{http_code}' \
            -H "api-key: $CLE" -H "accept: application/json" \
            "https://api.brevo.com/v3/contacts/lists/${LISTE:-3}")
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "Brevo a répondu $code pour la liste ${LISTE:-3} — on ne touche à rien."
            echo "ok=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nombre=$(printf '%s' "$corps" | jq -r '.totalSubscribers // empty')
          # Un nombre absent ou non numérique ne doit JAMAIS écraser le
          # compteur : mieux vaut un chiffre d'hier qu'un « null » à l'écran.
          case "$nombre" in
            ''|*[!0-9]*) echo "Compte illisible — on ne touche à rien."
                         echo "ok=non" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "ok=oui" >> "$GITHUB_OUTPUT"
          echo "Inscriptions : $nombre"

      - name: Compter aussi les téléchargements publics
        id: sorties
        # Ce chiffre-là n'est même pas affiché sur le site : il n'a aucun
        # droit de faire tomber l'ouvrage. Il l'a fait une fois — l'appel
        # partait sans jeton, GitHub a répondu « rate limit exceeded », et
        # jq s'est étranglé sur un objet d'erreur au lieu d'une liste. Le
        # nombre d'inscriptions était pourtant DÉJÀ relevé : il n'a jamais
        # été écrit, et le compteur du site est resté sur la veille.
        continue-on-error: true
        env:
          # Le jeton fourni par Actions : 1 000 appels par heure au lieu de
          # 60 partagés entre toutes les machines de GitHub.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reponse=$(curl -s -w '\n%{http_code}' \
            -H "accept: application/vnd.github+json" \
            -H "authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "GitHub a répondu $code — on laisse ce chiffre de côté."
            echo "total=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # « if type == array » : sans ce garde-fou, un corps d'erreur fait
          # sortir jq en échec, et bash -e emporte toute la tâche avec lui.
          total=$(printf '%s' "$corps" \
            | jq 'if type == "array" then ([.[].assets[]?.download_count] | add // 0) else empty end' \
            2>/dev/null || true)
          case "$total" in
            ''|*[!0-9]*) echo "Compte illisible — on laisse ce chiffre de côté."
                         echo "total=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Téléchargements : $total"

      - name: Écrire le fichier lu par le site
        if: steps.brevo.outputs.ok == 'oui'
        env:
          # Vide si GitHub n'a pas répondu : le compteur d'inscriptions,
          # lui, doit s'écrire quand même. C'est le seul des deux que la
          # page affiche.
          TELECHARGEMENTS: ${{ steps.sorties.outputs.total || 0 }}
        run: |
          mkdir -p site/donnees
          cat > site/donnees/compteur.json <<FIN
          {
            "inscriptions": ${{ steps.brevo.outputs.nombre }},
            "telechargements": ${TELECHARGEMENTS:-0},
            "releve": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          FIN
          cat site/donnees/compteur.json

      - name: Publier si le chiffre a bougé
        if: steps.brevo.outputs.ok == 'oui'
        run: |
          if git diff --quiet -- site/donnees/compteur.json; then
            echo "Aucun changement — pas de publication."
            exit 0
          fi
          git config user.name "Compteur Bingo Studio"
          git config user.email "actions@users.noreply.github.com"
          git add site/donnees/compteur.json
          git commit -m "Compteur : ${{ steps.brevo.outputs.nombre }} inscriptions"
          git push
